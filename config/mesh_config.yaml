name: "RodSim"
sim-mode: "Frame-by-frame"
# sim-mode: "AFAP"
time-step: 1e-3
end-time: 10

logging: False
logging-output-folder: "../output/convergence"
logging-interval: 10
log-residuals: True

hdr-image-filename: "../resource/studio_1k.hdr"
create-skybox: True
hdr-scaling: 0.2

ground-plane: True

render-for-video: False
render-output-folder: "../output/render/test"

objects:
  -
    type: "RigidMesh"
    filename: "../resource/meshes/Scissor_Straight.stl"
    scale: [1e-2, 1e-2, 1e-2]
    initial-position: [0, 0.5, 0]
    initial-rotation: [0, 0, 90]
    collisions: true
    fixed: true

  - 
    type: "Rod"
    name: "rod1"
    initial-position: [0.7, 0.9, -0.5]
    initial-rotation: [0, 0, 0]
    nodes: 20
    E: 1e6
    diameter: 0.05
    length: 1
    nu: 0.3
    base-fixed: False
    tip-fixed: False
    render-type: "PBR"
    # orm-texture-filename: "../resource/textures/Metal050A_4K-PNG/Metal050A_4K-PNG_ORM.png"
    # base-color-texture-filename: "../resource/textures/Metal050A_4K-PNG/Metal050A_4K-PNG_Color.png"
    metallic: 0.0
    roughness: 0.5
    color: [1.0, 0.0, 0.0]