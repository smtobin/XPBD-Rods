      density: 1000
      elements: 20
      collisions: false
    inner-tube:
      element-type: "Linear"
      E: 5e6
      nu: 0.4
      # beta: 1e2
      diameter: 0.08
      length: 1.5
      density: 1000
      elements: 20
      collisions: false